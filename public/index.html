<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="account"></div>
  <header class="masthead">
    <div class="masthead-top"><span data-today></span><span>Redmont, Commonwealth of Redmont</span><span>Democracy Craft</span></div>
    <a class="masthead-name" href="/" data-outlet-name>&nbsp;</a>
    <p class="masthead-tag">News of the Commonwealth of Redmont</p>
    <nav class="sections" id="sections" aria-label="Sections"></nav>
  </header>

  <main class="front">
    <form class="search" id="search" role="search">
      <input type="search" name="q" placeholder="Search the paper…" aria-label="Search articles">
      <button type="submit">Search</button>
    </form>
    <h2 class="section-title" id="sectionTitle" hidden></h2>
    <div id="stories" aria-live="polite"><p class="muted">Loading the latest edition…</p></div>
    <nav class="pager" id="pager" aria-label="Pages" hidden></nav>
  </main>

  <footer class="site-footer"><span data-outlet-name></span> · An independent Democracy Craft newspaper · <a href="https://github.com/YasuooMakeBaltica/news-outlet/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a></footer>
  <script src="common.js"></script>
  <script src="home.js"></script>
</body>
</html>
